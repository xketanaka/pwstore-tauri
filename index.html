<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pwstore</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>

    <!-- 初期化画面 -->
    <div data-screen="init" class="screen screen-init" hidden>
      <div class="init-card">
        <div class="init-header">
          <span class="init-icon">🔒</span>
          <h1>pwstore</h1>
          <p class="init-subtitle">初期設定</p>
        </div>

        <!-- ステップ1: パスフレーズ -->
        <div id="init-step1">
          <p class="init-hint">
            マスターパスフレーズを設定してください。
          </p>
          <form id="init-form" novalidate>
            <div class="field">
              <label for="init-passphrase">マスターパスフレーズ</label>
              <input
                type="password"
                id="init-passphrase"
                placeholder="8文字以上"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="field">
              <label for="init-passphrase-confirm">確認（再入力）</label>
              <input
                type="password"
                id="init-passphrase-confirm"
                autocomplete="new-password"
                required
              />
            </div>
            <div id="init-error" class="error-msg" hidden></div>
            <button type="submit" id="init-submit" class="btn-primary">
              次へ（Google認証）
            </button>
          </form>
        </div>

        <!-- ステップ2: Google OAuth -->
        <div id="init-step2" hidden>
          <p class="init-hint">
            ボタンを押してブラウザでGoogleアカウントを認証してください。<br>
            認証後、自動でアプリに戻ります。
          </p>
          <button id="init-oauth-btn" class="btn-primary">
            Googleアカウントで認証する
          </button>
          <p id="init-oauth-status" class="oauth-status"></p>
          <div id="init-oauth-error" class="error-msg" hidden></div>
        </div>
      </div>
    </div>

    <!-- 検索画面 -->
    <div data-screen="search" class="screen screen-search" hidden>
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="サービス名・キーワードで検索..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="search-admin-btn" class="btn-icon" title="管理画面">⚙</button>
      </div>
      <div id="search-status" class="search-status" hidden></div>
      <ul id="search-results" class="search-results" hidden></ul>
    </div>

    <!-- 管理画面 -->
    <div data-screen="admin" class="screen screen-admin" hidden>
      <div class="admin-toolbar">
        <span class="admin-title">pwstore 管理</span>
        <input type="text" id="service-search" class="admin-search" placeholder="キーワードで絞り込み..." autocomplete="off" spellcheck="false" />
        <div class="admin-toolbar-actions">
          <button id="admin-drive-sync-btn" class="btn-icon" title="Driveと同期">⇄</button>
          <button id="admin-reauth-btn" class="btn-icon" title="Google再認証">➲</button>
          <button id="admin-new-btn" class="btn-icon" title="新規エントリ">＋</button>
          <button id="admin-back-btn" class="btn-icon" title="検索画面へ">✕</button>
        </div>
      </div>
      <div id="admin-status" class="admin-status" hidden></div>
      <div class="admin-panes">
        <div class="pane pane-category">
          <div class="pane-header">カテゴリ</div>
          <ul id="category-list" class="pane-list"></ul>
        </div>
        <div class="pane pane-service">
          <div class="pane-header">サービス</div>
          <ul id="service-list" class="pane-list"></ul>
        </div>
        <div class="pane pane-detail">
          <div class="pane-header">アカウント情報</div>
          <div id="entry-detail" class="entry-detail">
            <p class="placeholder-text">左のリストからサービスを選択してください</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ローディング -->
    <div data-screen="loading" class="screen screen-loading">
      <span class="loading-spinner"></span>
    </div>

    <!-- 競合解消ダイアログ -->
    <div id="conflict-dialog" class="conflict-overlay" hidden>
      <div class="conflict-card">
        <p class="conflict-icon">⚠</p>
        <h2 class="conflict-title">データの競合</h2>
        <p class="conflict-desc">ローカルとDriveの両方で変更が行われています。<br>どちらのデータを使用しますか？</p>
        <div class="conflict-actions">
          <button id="conflict-use-local" class="btn-primary">ローカルを使用<span class="conflict-sub">Driveを上書き</span></button>
          <button id="conflict-use-drive" class="btn-primary">Driveを使用<span class="conflict-sub">ローカルを上書き</span></button>
          <button id="conflict-cancel" class="btn-conflict-cancel">何もしない<span class="conflict-sub">自分で解消する</span></button>
        </div>
      </div>
    </div>

  </body>
</html>
